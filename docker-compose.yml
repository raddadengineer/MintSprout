version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mintsprout-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mintsprout
      POSTGRES_USER: mintsprout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mintsprout_password}
    volumes:
      - ${MINTSPROUT_POSTGRES_DIR:-./data/postgres}:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - mintsprout-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mintsprout -d mintsprout"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MintSprout Application
  mintsprout:
    build: .
    container_name: mintsprout-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://mintsprout:${POSTGRES_PASSWORD:-mintsprout_password}@postgres:5432/mintsprout
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      # Profile picker (default on): children tap their name; parent uses PIN
      KIOSK_MODE: ${KIOSK_MODE:-true}
      PARENT_PIN: ${PARENT_PIN:-1234}
      KIOSK_FAMILY_ID: ${KIOSK_FAMILY_ID:-1}
      # AI coach — Open WebUI (gemma3:kids) + Kokoro kids voice
      AI_COACH_ENABLED: ${AI_COACH_ENABLED:-true}
      OPENWEBUI_BASE_URL: ${OPENWEBUI_BASE_URL:-https://ai.halnt.dev}
      OPENWEBUI_API_KEY: ${OPENWEBUI_API_KEY}
      OPENWEBUI_MODEL: ${OPENWEBUI_MODEL:-gemma3:kids}
      # Fallback if Open WebUI not configured: direct Ollama
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://192.168.10.7:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:latest}
      KIDS_VOICE_BASE_URL: ${KIDS_VOICE_BASE_URL:-http://192.168.10.7:8880/v1}
      KIDS_VOICE_MODEL: ${KIDS_VOICE_MODEL:-kokoro}
      AI_VOICE_YOUNGEST: ${AI_VOICE_YOUNGEST:-af_bella}
      AI_VOICE_YOUNGER: ${AI_VOICE_YOUNGER:-af_sky}
      BACKUP_DIR: /app/backups
    ports:
      - "8080:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mintsprout-network
    volumes:
      - ${MINTSPROUT_LOGS_DIR:-./data/logs}:/app/logs
      - ${MINTSPROUT_BACKUPS_DIR:-./data/backups}:/app/backups
    healthcheck:
      # Use 127.0.0.1 (not localhost) so the healthcheck doesn't fail on IPv6-only localhost resolution.
      # Use a public endpoint that returns 200 without auth.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  mintsprout-network:
    driver: bridge
