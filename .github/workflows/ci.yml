name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Ensure production bundle does not import vite
        run: |
          if grep -E 'from ["'\'']vite["'\'']|import\(["'\'']vite["'\'']\)' dist/index.js; then
            echo "dist/index.js must not import vite in production"
            exit 1
          fi

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mintsprout
          POSTGRES_PASSWORD: mintsprout
          POSTGRES_DB: mintsprout
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://mintsprout:mintsprout@localhost:5432/mintsprout
      CI_POSTGRES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npx vitest run server/postgres-smoke.test.ts

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mintsprout:ci .
