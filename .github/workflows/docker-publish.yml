name: Publish Docker image

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: raddadengineer/mintsprout:latest

      - name: Verify production bundle does not import vite
        run: |
          docker create --name mintsprout-verify raddadengineer/mintsprout:latest
          docker cp mintsprout-verify:/app/dist/index.js dist/index.js
          docker rm mintsprout-verify
          if grep -E 'from ["'\'']vite["'\'']|import\(["'\'']vite["'\'']\)' dist/index.js; then
            echo "Published image must not import vite in dist/index.js"
            exit 1
          fi
