version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mintsprout-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mintsprout
      POSTGRES_USER: mintsprout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mintsprout_password}
    volumes:
      - ${MINTSPROUT_POSTGRES_DIR:-./data/postgres}:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mintsprout-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mintsprout -d mintsprout"]
      interval: 10s
      timeout: 5s
      retries: 5

  mintsprout:
    image: raddadengineer/mintsprout:latest
    container_name: mintsprout-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://mintsprout:${POSTGRES_PASSWORD:-mintsprout_password}@postgres:5432/mintsprout
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      KIOSK_MODE: ${KIOSK_MODE:-true}
      PARENT_PIN: ${PARENT_PIN:-1234}
      KIOSK_FAMILY_ID: ${KIOSK_FAMILY_ID:-1}
      BACKUP_DIR: /app/backups
    ports:
      - "8080:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mintsprout-network
    volumes:
      - ${MINTSPROUT_LOGS_DIR:-./data/logs}:/app/logs
      - ${MINTSPROUT_BACKUPS_DIR:-./data/backups}:/app/backups

networks:
  mintsprout-network:
    driver: bridge
